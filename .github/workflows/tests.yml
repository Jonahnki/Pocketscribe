name: tests

# Minute-frugal by design, because this repository is private and GitHub Actions
# minutes on a private repo come out of a monthly allowance.
#
#   every push / PR  ->  ONE Linux job (lint + tests + demo smoke test), ~2 minutes
#   on demand        ->  the full matrix and the real-fpocket integration job
#
# Linux runners bill at 1x. macOS bills at 10x and Windows at 2x, so neither runs
# automatically here: a five-minute macOS job would cost fifty minutes of allowance.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "CITATION.cff", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "CITATION.cff", "LICENSE", ".gitignore"]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full Python matrix"
        type: boolean
        default: false
      fpocket:
        description: "Run the real-fpocket integration job (slow: conda)"
        type: boolean
        default: false

permissions:
  contents: read

# A new push supersedes an in-flight run instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The everyday job. Lint and tests share one runner: a second job would pay
  # ── the ~30s checkout + Python setup cost again for about 10 seconds of ruff.
  check:
    name: lint + tests (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Runs without fpocket, GROMACS or network access by design: bundled synthetic
      # structures and a checked-in fpocket output format sample.
      - name: Tests
        run: pytest -q

      - name: Demo smoke test
        run: |
          pocketscribe demo --output /tmp/demo.html
          test -s /tmp/demo.html
          pocketscribe demo --consensus --output /tmp/consensus.html
          grep -q "same-family-only" /tmp/consensus.html
          grep -q "cross-family" /tmp/consensus.html

  # ── Opt-in: other supported Python versions. Linux only (1x minute multiplier).
  matrix:
    name: tests (py${{ matrix.python-version }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q

  # ── Opt-in: the only place the real fpocket binary is exercised. Kept out of the
  # ── default path because installing it costs several minutes every run.
  fpocket:
    name: real fpocket integration
    if: github.event_name == 'workflow_dispatch' && inputs.fpocket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # micromamba resolves in seconds where conda takes minutes.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ps
          create-args: >-
            python=3.12
            fpocket
          condarc: |
            channels:
              - conda-forge

      - name: Install Pocketscribe
        run: pip install -e ".[dev]"

      - name: Confirm fpocket is present
        run: which fpocket && (fpocket --version || true)

      - name: Run against the real binary
        run: |
          pocketscribe run \
            --pdb pocketscribe/data/example_structures/AF-SYNTH01-F1-model_v4.pdb \
            --source alphafold2 \
            --output /tmp/fpocket_report.html
          test -s /tmp/fpocket_report.html
          grep -q "fpocket" /tmp/fpocket_report.html
