[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketscribe"
version = "0.1.0"
description = "Confidence-aware binding-pocket triage for predicted protein structures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "John Adeyemo Adedeji", email = "johnnaadedeji2018@gmail.com"},
]
keywords = [
    "structural bioinformatics",
    "binding pocket",
    "druggability",
    "AlphaFold",
    "pLDDT",
    "fpocket",
    "molecular dynamics",
    "GROMACS",
    "drug discovery",
    "predicted protein structures",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "biopython>=1.80",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Jonahnki/Pocketscribe"
Documentation = "https://github.com/Jonahnki/Pocketscribe#readme"
Repository = "https://github.com/Jonahnki/Pocketscribe"
Issues = "https://github.com/Jonahnki/Pocketscribe/issues"
Zenodo = "https://doi.org/10.5281/zenodo.22967237"
Demo = "https://pocketscribe.vercel.app"

[project.scripts]
pocketscribe = "pocketscribe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pocketscribe*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
